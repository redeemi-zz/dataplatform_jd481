[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redeemi-zz-dataplatform_jd481"
version = "0.1.0"
description = "在同一个输入里两两比对，检测数据平台工程师·GPU 故障与作业自愈相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "redeemi-zz" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://redeemi-zz.github.io"
Repository = "https://github.com/redeemi-zz/dataplatform_jd481"
Issues = "https://github.com/redeemi-zz/dataplatform_jd481/issues"

[project.scripts]
dataplatform_jd481 = "dataplatform_jd481:main"

[tool.setuptools]
py-modules = ["dataplatform_jd481"]
